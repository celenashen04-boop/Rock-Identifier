<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rock or Stuffed Rock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f1ec;
    --panel: #ffffff;
    --ink: #22201c;
    --muted: #77716a;
    --line: #e3ddd4;
    --rock: #7d756b;
    --stuffed: #d9826b;
    --accent: #22201c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1917;
      --panel: #242220;
      --ink: #f0ece6;
      --muted: #a39d95;
      --line: #36332f;
      --rock: #a89f94;
      --stuffed: #e8987f;
      --accent: #f0ece6;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: Inter, system-ui, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 880px; margin: 0 auto; padding: 40px 16px 64px; }
  header h1 {
    font-family: Fraunces, Georgia, serif;
    font-size: clamp(2rem, 6vw, 3.2rem);
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.02em;
  }
  header h1 em { font-style: normal; color: var(--stuffed); }
  header p { color: var(--muted); margin: 6px 0 28px; }

  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tabs button {
    font: inherit; font-weight: 500;
    padding: 8px 16px; border-radius: 999px;
    border: 1px solid var(--line); background: transparent; color: var(--ink);
    cursor: pointer;
  }
  .tabs button[aria-selected="true"] { background: var(--accent); color: var(--bg); border-color: var(--accent); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 680px) { .grid { grid-template-columns: 1fr; } }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
  }
  .stage {
    aspect-ratio: 1;
    border-radius: 12px;
    background: var(--bg);
    display: grid; place-items: center;
    overflow: hidden; position: relative;
    border: 2px dashed transparent;
  }
  .stage.drop { border-color: var(--stuffed); }
  .stage canvas, .stage img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .stage .hint { color: var(--muted); text-align: center; padding: 24px; }
  .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .btn {
    font: inherit; font-weight: 600;
    padding: 10px 18px; border-radius: 10px;
    border: none; background: var(--accent); color: var(--bg);
    cursor: pointer;
  }
  .btn.secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btn:disabled { opacity: .4; cursor: default; }

  .verdict { font-family: Fraunces, Georgia, serif; font-size: 2rem; font-weight: 700; margin: 4px 0 20px; min-height: 3rem; }
  .label-sm { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .bar { margin-bottom: 16px; }
  .bar-top { display: flex; justify-content: space-between; font-weight: 500; margin-bottom: 6px; }
  .bar-top span:last-child { font-variant-numeric: tabular-nums; color: var(--muted); }
  .track { height: 14px; border-radius: 999px; background: var(--bg); overflow: hidden; }
  .fill { height: 100%; width: 0; border-radius: 999px; transition: width .15s ease-out; }
  .status { color: var(--muted); font-size: .9rem; margin-top: 12px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Rock or <em>Stuffed</em> Rock?</h1>
    <p>A Teachable Machine model that tells real rocks from soft ones.</p>
  </header>

  <div class="tabs" role="tablist">
    <button role="tab" id="tab-cam" aria-selected="true">Webcam</button>
    <button role="tab" id="tab-upload" aria-selected="false">Upload photo</button>
  </div>

  <div class="grid">
    <section class="panel">
      <div id="cam-view">
        <div class="stage" id="cam-stage"><div class="hint">Start the camera and hold up a rock.</div></div>
        <div class="row">
          <button class="btn" id="cam-toggle" disabled>Loading model…</button>
          <button class="btn secondary" id="cam-flip" hidden>Mirror</button>
        </div>
      </div>
      <div id="upload-view" hidden>
        <div class="stage" id="drop-stage"><div class="hint">Drop an image here<br>or choose a file.</div></div>
        <div class="row">
          <label class="btn" for="file">Choose image</label>
          <input type="file" id="file" accept="image/*" hidden>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="label-sm">Verdict</div>
      <div class="verdict" id="verdict">—</div>
      <div id="bars"></div>
      <div class="status" id="status">Loading model…</div>
    </section>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js"></script>
<script>
  const COLORS = { 'Rock': 'var(--rock)', 'Stuffed Rock': 'var(--stuffed)' };
  let model, webcam, running = false, flip = true;

  const $ = id => document.getElementById(id);
  const statusEl = $('status');

  async function init() {
    try {
      model = await tmImage.load('./model.json', './metadata.json');
    } catch (e) {
      statusEl.textContent = 'Could not load the model. Open this page through a local server (python3 -m http.server), not by double-clicking the file.';
      console.error(e);
      return;
    }
    const bars = $('bars');
    model.getClassLabels().forEach((label, i) => {
      bars.insertAdjacentHTML('beforeend', `
        <div class="bar">
          <div class="bar-top"><span>${label}</span><span id="pct-${i}">0%</span></div>
          <div class="track"><div class="fill" id="fill-${i}" style="background:${COLORS[label] || 'var(--accent)'}"></div></div>
        </div>`);
    });
    $('cam-toggle').disabled = false;
    $('cam-toggle').textContent = 'Start camera';
    statusEl.textContent = 'Model ready.';
  }

  function show(predictions) {
    let best = predictions[0];
    predictions.forEach((p, i) => {
      const pct = Math.round(p.probability * 100);
      $('pct-' + i).textContent = pct + '%';
      $('fill-' + i).style.width = pct + '%';
      if (p.probability > best.probability) best = p;
    });
    const v = $('verdict');
    v.textContent = best.probability > 0.6 ? best.className : 'Not sure…';
    v.style.color = best.probability > 0.6 ? (COLORS[best.className] || 'inherit') : 'var(--muted)';
  }

  // Webcam
  async function startCam() {
    const btn = $('cam-toggle');
    btn.disabled = true; btn.textContent = 'Starting…';
    try {
      webcam = new tmImage.Webcam(400, 400, flip);
      await webcam.setup();
      await webcam.play();
    } catch (e) {
      statusEl.textContent = 'Camera unavailable or permission denied.';
      btn.disabled = false; btn.textContent = 'Start camera';
      return;
    }
    const stage = $('cam-stage');
    stage.innerHTML = '';
    stage.appendChild(webcam.canvas);
    running = true;
    btn.disabled = false; btn.textContent = 'Stop camera';
    $('cam-flip').hidden = false;
    statusEl.textContent = 'Classifying live.';
    loop();
  }

  function stopCam() {
    running = false;
    if (webcam) webcam.stop();
    $('cam-stage').innerHTML = '<div class="hint">Camera stopped.</div>';
    $('cam-toggle').textContent = 'Start camera';
    $('cam-flip').hidden = true;
  }

  async function loop() {
    if (!running) return;
    webcam.update();
    show(await model.predict(webcam.canvas));
    requestAnimationFrame(loop);
  }

  $('cam-toggle').onclick = () => running ? stopCam() : startCam();
  $('cam-flip').onclick = async () => { flip = !flip; stopCam(); await startCam(); };

  // Upload
  function classifyFile(file) {
    if (!file || !file.type.startsWith('image/')) return;
    const img = new Image();
    img.onload = async () => {
      const stage = $('drop-stage');
      stage.innerHTML = '';
      stage.appendChild(img);
      show(await model.predict(img));
      statusEl.textContent = file.name;
    };
    img.src = URL.createObjectURL(file);
  }
  $('file').onchange = e => classifyFile(e.target.files[0]);
  const drop = $('drop-stage');
  ['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('drop'); }));
  ['dragleave', 'drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('drop'); }));
  drop.addEventListener('drop', e => classifyFile(e.dataTransfer.files[0]));

  // Tabs
  function selectTab(cam) {
    $('tab-cam').setAttribute('aria-selected', cam);
    $('tab-upload').setAttribute('aria-selected', !cam);
    $('cam-view').hidden = !cam;
    $('upload-view').hidden = cam;
    if (!cam && running) stopCam();
  }
  $('tab-cam').onclick = () => selectTab(true);
  $('tab-upload').onclick = () => selectTab(false);

  init();
</script>
</body>
</html>
